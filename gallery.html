<style>
  html,
  body {
    margin: 0;
    padding: 0;
    background: #0a0806;
    overflow: hidden;
    width: 100%;
    height: 100%
  }

  svg {
    display: block;
    width: 100%;
    height: 100vh
  }

  .drop {
    animation: drop 1.2s cubic-bezier(.22, .61, .36, 1) both
  }

  .swing {
    transform-origin: center top
  }

  @keyframes drop {
    from {
      transform: translateY(-280px);
      opacity: 0
    }

    to {
      transform: translateY(0);
      opacity: 1
    }
  }

  @keyframes fadein {
    from {
      opacity: 0
    }

    to {
      opacity: 1
    }
  }

  .lbl {
    animation: fadein .6s ease both
  }
</style>
